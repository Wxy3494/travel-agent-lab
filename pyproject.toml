[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-lab"
version = "0.1.0"
description = "Evidence-aware city and intercity travel planning with AutoGen"
requires-python = ">=3.11,<3.14"
dependencies = [
  "autogen-agentchat==0.7.5", "autogen-ext[openai]==0.7.5",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3",
  "httpx>=0.27,<1", "streamlit>=1.40,<2", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ui_theme.css", "assets/*.jpg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
